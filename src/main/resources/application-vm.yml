# 虚拟机环境配置
# 请修改下面的IP地址为您虚拟机的实际IP地址

#springboot配置
spring:
  #Redis配置 - 虚拟机
  redis:
    host:  192.168.88.129        # 虚拟机的IP地址
    port: 6379
    password: 123456            # Redis设置的密码
    database: 0
    timeout: 10000ms
    lettuce:
      pool:
        max-active: 20
        max-wait: -1ms
        max-idle: 10
        min-idle: 5
  #RabbitMQ配置 - 虚拟机
  rabbitmq:
    host: 192.168.88.129        # 虚拟机的IP地址
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        prefetch: 1
        acknowledge-mode: manual
        concurrency: 3
        max-concurrency: 10
